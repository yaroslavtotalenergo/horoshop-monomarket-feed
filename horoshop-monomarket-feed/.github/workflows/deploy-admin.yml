name: Deploy Admin Panel to GitHub Pages

on:
  # Запускається при пуші в папку admin на гілці main
  push:
    branches: ["main"]
    paths:
      - 'admin/**'
  
  # Дозволяє запустити вручну з вкладки Actions
  workflow_dispatch:

# Встановлює права доступу GITHUB_TOKEN, щоб можна було задеплоїти на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяє лише один одночасний деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Збірка (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Install dependencies
        run: npm ci
        working-directory: ./admin
        
      - name: Build
        run: npm run build
        working-directory: ./admin
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './admin/dist'

  # Розгортання (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
