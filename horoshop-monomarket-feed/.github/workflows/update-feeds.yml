name: Update Monomarket Feeds

on:
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync remote changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Run converter
        env:
          HOROSHOP_FEED_URL: ${{ secrets.HOROSHOP_FEED_URL }}
          DEFAULT_STOCK: ${{ vars.DEFAULT_STOCK || '10' }}
          WAREHOUSE_ID: ${{ vars.WAREHOUSE_ID || 'stock01te' }}
          WARRANTY_TYPE: ${{ vars.WARRANTY_TYPE || 'manufacturer' }}
          WARRANTY_PERIOD: ${{ vars.WARRANTY_PERIOD || '60' }}
          MAX_PAY_IN_PARTS: ${{ vars.MAX_PAY_IN_PARTS || '6' }}
          DAYS_TO_DISPATCH: ${{ vars.DAYS_TO_DISPATCH || '1' }}
          SHOP_NAME: ${{ vars.SHOP_NAME || 'Store' }}
        run: node src/convert.js

      - name: Push updated feeds
        run: |
          git add feeds/
          git diff --staged --quiet || git commit -m "Update feeds"
          git push || (git pull --rebase -X theirs origin main && git push)
