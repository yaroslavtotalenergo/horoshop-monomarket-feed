name: Update Monomarket Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '14,44 * * * *'

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Stock from Google Sheets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          GOOGLE_SHEETS_URLS: ${{ secrets.GOOGLE_SHEETS_URLS }}
          WAREHOUSE_NAMES: ${{ secrets.WAREHOUSE_NAMES }}
        run: node src/sync-stock.js

      - name: Run converter
        env:
          HOROSHOP_FEED_URL: ${{ secrets.HOROSHOP_FEED_URL }}
          DEFAULT_STOCK: ${{ vars.DEFAULT_STOCK || '10' }}
          WAREHOUSE_ID: ${{ vars.WAREHOUSE_ID || 'main' }}
          WARRANTY_TYPE: ${{ vars.WARRANTY_TYPE || 'manufacturer' }}
          WARRANTY_PERIOD: ${{ vars.WARRANTY_PERIOD || '60' }}
          MAX_PAY_IN_PARTS: ${{ vars.MAX_PAY_IN_PARTS || '6' }}
          DAYS_TO_DISPATCH: ${{ vars.DAYS_TO_DISPATCH || '1' }}
          SHOP_NAME: ${{ vars.SHOP_NAME || 'Store' }}
        run: node src/convert.js

      - name: Push to Horoshop API
        env:
          HOROSHOP_DOMAIN: ${{ secrets.HOROSHOP_DOMAIN }}
          HOROSHOP_API_LOGIN: ${{ secrets.HOROSHOP_API_LOGIN }}
          HOROSHOP_API_PASSWORD: ${{ secrets.HOROSHOP_API_PASSWORD }}
        run: node src/update-horoshop.js

      - name: Push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ src/stock.json src/availability.json src/stock-changes.json src/categories.json src/prom-skus.json src/horoshop-short-desc-backup.json
          git diff --staged --quiet && exit 0
          git commit -m "Update feeds and stock"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Успішно відправлено на GitHub"
              exit 0
            fi
            echo "⚠️ Push не пройшов, оновлюємося з origin/main..."
            git fetch origin main
            git rebase -X theirs origin/main || {
              echo "⚠️ Конфлікт ребейзу — безпечно скидаємо та накатуємо свіжі дані на актуальний origin/main..."
              git rebase --abort || true
              git reset --soft origin/main
              git add feeds/ src/stock.json src/availability.json src/stock-changes.json src/categories.json src/prom-skus.json src/horoshop-short-desc-backup.json
              git commit -m "Update feeds and stock" || true
            }
            sleep 3
          done
          exit 1
