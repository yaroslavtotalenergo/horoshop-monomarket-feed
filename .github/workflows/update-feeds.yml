name: Update Monomarket Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '14,44 * * * *'
jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Sync Stock from Google Sheets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/sync-stock.js


      - name: Run converter
        env:
          HOROSHOP_FEED_URL: ${{ secrets.HOROSHOP_FEED_URL }}
          DEFAULT_STOCK: ${{ vars.DEFAULT_STOCK || '10' }}
          WAREHOUSE_ID: ${{ vars.WAREHOUSE_ID || 'main' }}
          WARRANTY_TYPE: ${{ vars.WARRANTY_TYPE || 'manufacturer' }}
          WARRANTY_PERIOD: ${{ vars.WARRANTY_PERIOD || '60' }}
          MAX_PAY_IN_PARTS: ${{ vars.MAX_PAY_IN_PARTS || '6' }}
          DAYS_TO_DISPATCH: ${{ vars.DAYS_TO_DISPATCH || '1' }}
          SHOP_NAME: ${{ vars.SHOP_NAME || 'Store' }}
        run: node src/convert.js

      - name: Push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ src/stock.json src/availability.json
          git diff --staged --quiet || git commit -m "Update feeds and stock"
          git pull --rebase origin main -X theirs || true
          git push

